services:
  postgres:
    image: postgres
    container_name: ${POSTGRES_CONTAINER}
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./db-data:/var/lib/postgresql/data
    restart: always
  
  app:
    build: .
    container_name: app
    ports:
      - "${WEB_PORT}:8000"
    depends_on:
      - postgres
    restart: always

volumes:
  db-data:
    driver: local